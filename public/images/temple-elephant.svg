<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="elephantBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#3d1b04"/>
      <stop offset="60%" stop-color="#210d01"/>
      <stop offset="100%" stop-color="#0a0400"/>
    </radialGradient>
    <linearGradient id="antiqueGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="clothRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#elephantBg)"/>
  <rect x="25" y="25" width="550" height="550" rx="16" fill="none" stroke="url(#antiqueGold)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Caparisoned Royal Elephant (Temple Kasavu style) -->
  <g transform="translate(180, 160)">
    <!-- Elephant Silhouette -->
    <path d="M 120,60 C 180,60 220,100 220,160 C 220,180 210,240 210,260 L 180,260 C 180,220 170,180 150,170 C 140,230 140,260 110,260 L 80,260 C 80,220 70,180 50,180 C 40,230 40,260 10,260 L -10,260 C -10,180 10,120 50,80 Z" fill="#475569" stroke="url(#antiqueGold)" stroke-width="2" stroke-dasharray="4,2"/>

    <!-- Trunk Raising High -->
    <path d="M 50,80 C 30,70 10,80 -10,110 C -30,140 -40,190 -20,200 C 0,210 0,160 20,130 Z" fill="#475569" stroke="url(#antiqueGold)" stroke-width="2"/>

    <!-- Howdah / Decorated Saddle Cloth (Jhool) -->
    <path d="M 70,120 L 160,120 L 170,190 L 60,190 Z" fill="url(#clothRuby)" stroke="url(#antiqueGold)" stroke-width="3"/>
    <circle cx="115" cy="155" r="18" fill="url(#antiqueGold)"/>
    <circle cx="115" cy="155" r="8" fill="#4c0519"/>

    <!-- Head Nettyppattam (Gold Headplate) -->
    <polygon points="40,90 20,110 50,130" fill="url(#antiqueGold)"/>
    <circle cx="45" cy="95" r="4" fill="#be123c"/>
    <circle cx="30" cy="110" r="4" fill="#be123c"/>
  </g>

  <!-- Technical Spec Badge -->
  <g transform="translate(40, 520)">
    <rect width="210" height="42" rx="8" fill="#000000" opacity="0.6"/>
    <text x="15" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fef3c7">STITCHES: 28,400 | BLOUSE MOTIF</text>
  </g>

  <!-- Watermark Diagonal -->
  <g opacity="0.22" transform="rotate(-30 300 300)">
    <text x="-50" y="300" font-family="serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="12">MADHUS BOUTIQUE PREVIEW</text>
    <line x1="-100" y1="315" x2="700" y2="315" stroke="#ffffff" stroke-width="2" stroke-dasharray="10,5"/>
  </g>
</svg>
