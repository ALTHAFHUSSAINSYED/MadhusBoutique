<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="sareeBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#143026"/>
      <stop offset="70%" stop-color="#091b15"/>
      <stop offset="100%" stop-color="#040b08"/>
    </radialGradient>
    <linearGradient id="pureGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1aa"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="80%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#e6c673"/>
    </linearGradient>
    <linearGradient id="rubyFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#sareeBg)"/>
  <rect x="25" y="25" width="550" height="550" rx="16" fill="none" stroke="url(#pureGold)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Paisley Motif (Mango / Kalka) -->
  <g transform="translate(180, 80)">
    <!-- Main Paisley Contour -->
    <path d="M 120,380 C 40,380 0,300 0,220 C 0,100 80,40 180,0 C 140,70 170,140 210,130 C 250,120 250,50 180,0 C 230,80 250,180 230,260 C 200,360 160,380 120,380 Z" fill="url(#rubyFill)" stroke="url(#pureGold)" stroke-width="3" stroke-dasharray="4,2"/>
    
    <!-- Internal Jali Pattern -->
    <circle cx="100" cy="220" r="45" fill="none" stroke="url(#pureGold)" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="100" cy="220" r="25" fill="url(#pureGold)" opacity="0.8"/>
    <circle cx="100" cy="220" r="12" fill="#143026"/>

    <!-- Small Florets inside -->
    <circle cx="70" cy="140" r="10" fill="url(#pureGold)"/>
    <circle cx="130" cy="140" r="10" fill="url(#pureGold)"/>
    <circle cx="70" cy="300" r="12" fill="url(#pureGold)"/>
    <circle cx="130" cy="300" r="12" fill="url(#pureGold)"/>

    <!-- External Bead Embellishments -->
    <circle cx="5" cy="200" r="6" fill="url(#pureGold)"/>
    <circle cx="15" cy="260" r="6" fill="url(#pureGold)"/>
    <circle cx="45" cy="320" r="6" fill="url(#pureGold)"/>
    <circle cx="90" cy="360" r="6" fill="url(#pureGold)"/>
  </g>

  <!-- Technical Spec Badge -->
  <g transform="translate(40, 520)">
    <rect width="210" height="42" rx="8" fill="#000000" opacity="0.6"/>
    <text x="15" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fef3c7">STITCHES: 31,200 | DST/PES/EXP</text>
  </g>

  <!-- Watermark Diagonal -->
  <g opacity="0.22" transform="rotate(-30 300 300)">
    <text x="-50" y="300" font-family="serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="12">MADHUS BOUTIQUE PREVIEW</text>
    <line x1="-100" y1="315" x2="700" y2="315" stroke="#ffffff" stroke-width="2" stroke-dasharray="10,5"/>
  </g>
</svg>
