<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="mirrorBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="silverMirror" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="vibrantGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#mirrorBg)"/>
  <rect x="25" y="25" width="550" height="550" rx="16" fill="none" stroke="url(#vibrantGold)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Geometric Chevron Waves -->
  <g transform="translate(50, 160)">
    <path d="M 0,0 L 80,60 L 160,0 L 240,60 L 320,0 L 400,60 L 480,0" fill="none" stroke="url(#vibrantGold)" stroke-width="4" stroke-dasharray="6,3"/>
    <path d="M 0,80 L 80,140 L 160,80 L 240,140 L 320,80 L 400,140 L 480,80" fill="none" stroke="url(#vibrantGold)" stroke-width="4" stroke-dasharray="6,3"/>
    <path d="M 0,160 L 80,220 L 160,160 L 240,220 L 320,160 L 400,220 L 480,160" fill="none" stroke="url(#vibrantGold)" stroke-width="4" stroke-dasharray="6,3"/>

    <!-- Mirror Work Sequins (6mm circles with embroidered borders) -->
    <circle cx="80" cy="60" r="18" fill="url(#silverMirror)" stroke="#fef08a" stroke-width="2.5"/>
    <circle cx="240" cy="60" r="18" fill="url(#silverMirror)" stroke="#fef08a" stroke-width="2.5"/>
    <circle cx="400" cy="60" r="18" fill="url(#silverMirror)" stroke="#fef08a" stroke-width="2.5"/>

    <circle cx="160" cy="80" r="18" fill="url(#silverMirror)" stroke="#fef08a" stroke-width="2.5"/>
    <circle cx="320" cy="80" r="18" fill="url(#silverMirror)" stroke="#fef08a" stroke-width="2.5"/>

    <circle cx="80" cy="140" r="18" fill="url(#silverMirror)" stroke="#fef08a" stroke-width="2.5"/>
    <circle cx="240" cy="140" r="18" fill="url(#silverMirror)" stroke="#fef08a" stroke-width="2.5"/>
    <circle cx="400" cy="140" r="18" fill="url(#silverMirror)" stroke="#fef08a" stroke-width="2.5"/>
  </g>

  <!-- Technical Spec Badge -->
  <g transform="translate(40, 520)">
    <rect width="210" height="42" rx="8" fill="#000000" opacity="0.6"/>
    <text x="15" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fef3c7">STITCHES: 19,800 | MIRROR POCKETS</text>
  </g>

  <!-- Watermark Diagonal -->
  <g opacity="0.22" transform="rotate(-30 300 300)">
    <text x="-50" y="300" font-family="serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="12">MADHUS BOUTIQUE PREVIEW</text>
    <line x1="-100" y1="315" x2="700" y2="315" stroke="#ffffff" stroke-width="2" stroke-dasharray="10,5"/>
  </g>
</svg>
