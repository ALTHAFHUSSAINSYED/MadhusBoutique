<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="heroFabric" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#4a0d1e"/>
      <stop offset="60%" stop-color="#2a050f"/>
      <stop offset="100%" stop-color="#140106"/>
    </radialGradient>
    <linearGradient id="luxeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1b8"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#heroFabric)"/>

  <!-- Embroidery Hoop Frame Graphic -->
  <circle cx="400" cy="300" r="240" fill="none" stroke="#ca8a04" stroke-width="12" opacity="0.8"/>
  <circle cx="400" cy="300" r="232" fill="none" stroke="#713f12" stroke-width="3"/>
  <rect x="385" y="45" width="30" height="20" rx="4" fill="#a16207" stroke="#eab308"/>

  <!-- Ornate Concentric Mandala Stitches -->
  <g transform="translate(400, 300)">
    <!-- Outer Petal Ring -->
    <g stroke="url(#luxeGold)" stroke-width="2.5" stroke-dasharray="6,3" fill="none">
      <circle cx="0" cy="0" r="190"/>
      <circle cx="0" cy="0" r="160"/>
      <circle cx="0" cy="0" r="130"/>
    </g>

    <!-- Radiating Floral Spokes -->
    <path d="M 0,-190 L 0,190 M -190,0 L 190,0 M -134,-134 L 134,134 M -134,134 L 134,-134" stroke="url(#luxeGold)" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Central Lotus Jewel -->
    <circle cx="0" cy="0" r="70" fill="#881337" stroke="url(#luxeGold)" stroke-width="3"/>
    <circle cx="0" cy="0" r="40" fill="url(#luxeGold)"/>
    <circle cx="0" cy="0" r="20" fill="#4c0519"/>

    <!-- Stitch Needle Illustration -->
    <g transform="translate(110, -110) rotate(45)">
      <line x1="-70" y1="0" x2="60" y2="0" stroke="#f8fafc" stroke-width="3"/>
      <polygon points="60,-3 75,0 60,3" fill="#f8fafc"/>
      <circle cx="-55" cy="0" r="3" fill="#000000"/>
      <!-- Gold Thread coming out -->
      <path d="M -55,0 Q -90,-30 -130,-10 Q -170,10 -200,-40" fill="none" stroke="url(#luxeGold)" stroke-width="2.5" stroke-dasharray="5,2"/>
    </g>
  </g>

  <!-- Subtitle Seal -->
  <g transform="translate(400, 540)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#1e040b" stroke="url(#luxeGold)" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#fef3c7" letter-spacing="3">MADHUS BOUTIQUE • EST. 2026</text>
  </g>
</svg>
