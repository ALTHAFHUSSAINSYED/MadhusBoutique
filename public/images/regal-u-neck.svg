<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="neckBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#3b0713"/>
      <stop offset="60%" stop-color="#20030a"/>
      <stop offset="100%" stop-color="#0c0104"/>
    </radialGradient>
    <linearGradient id="regalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8cc"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#neckBg)"/>
  <rect x="25" y="25" width="550" height="550" rx="16" fill="none" stroke="url(#regalGold)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- U-Neckline Curve Profile -->
  <g transform="translate(300, 100)">
    <!-- Base Cutout of Neckline (Transparent / Body illusion) -->
    <path d="M -160,0 C -160,240 160,240 160,0" fill="none" stroke="#2a050d" stroke-width="20"/>

    <!-- Aari Work Multi-layer Chain Stitches -->
    <path d="M -170,0 C -170,260 170,260 170,0" fill="none" stroke="url(#regalGold)" stroke-width="4" stroke-dasharray="6,3"/>
    <path d="M -190,0 C -190,285 190,285 190,0" fill="none" stroke="url(#regalGold)" stroke-width="2" stroke-dasharray="3,2"/>
    <path d="M -210,0 C -210,310 210,310 210,0" fill="none" stroke="url(#regalGold)" stroke-width="6" stroke-dasharray="8,4"/>

    <!-- Bead Stones along Neck Curve -->
    <circle cx="-130" cy="180" r="7" fill="#fef08a" stroke="#d4af37"/>
    <circle cx="-70" cy="235" r="7" fill="#fef08a" stroke="#d4af37"/>
    <circle cx="0" cy="255" r="9" fill="#fef08a" stroke="#d4af37"/>
    <circle cx="70" cy="235" r="7" fill="#fef08a" stroke="#d4af37"/>
    <circle cx="130" cy="180" r="7" fill="#fef08a" stroke="#d4af37"/>

    <!-- Floral Teardrop Drops Hanging Under Neck -->
    <path d="M 0,270 C -15,310 0,340 0,340 C 0,340 15,310 0,270 Z" fill="url(#regalGold)"/>
    <circle cx="0" cy="350" r="6" fill="#fef08a"/>

    <path d="M -70,250 C -85,285 -70,310 -70,310 C -70,310 -55,285 -70,250 Z" fill="url(#regalGold)"/>
    <circle cx="-70" cy="318" r="5" fill="#fef08a"/>

    <path d="M 70,250 C 55,285 70,310 70,310 C 70,310 85,285 70,250 Z" fill="url(#regalGold)"/>
    <circle cx="70" cy="318" r="5" fill="#fef08a"/>
  </g>

  <!-- Technical Spec Badge -->
  <g transform="translate(40, 520)">
    <rect width="210" height="42" rx="8" fill="#000000" opacity="0.6"/>
    <text x="15" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fef3c7">STITCHES: 36,500 | U-NECK AARI</text>
  </g>

  <!-- Watermark Diagonal -->
  <g opacity="0.22" transform="rotate(-30 300 300)">
    <text x="-50" y="300" font-family="serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="12">MADHUS BOUTIQUE PREVIEW</text>
    <line x1="-100" y1="315" x2="700" y2="315" stroke="#ffffff" stroke-width="2" stroke-dasharray="10,5"/>
  </g>
</svg>
