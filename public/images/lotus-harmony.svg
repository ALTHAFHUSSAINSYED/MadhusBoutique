<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="lotusBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f2b24"/>
      <stop offset="60%" stop-color="#071713"/>
      <stop offset="100%" stop-color="#030806"/>
    </radialGradient>
    <linearGradient id="lotusPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="60%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="softGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#lotusBg)"/>
  <rect x="25" y="25" width="550" height="550" rx="16" fill="none" stroke="url(#softGold)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Lotus Flower Composition -->
  <g transform="translate(300, 280)">
    <!-- Back Petals -->
    <path d="M 0,40 C -80,-60 -120,-160 -90,-200 C -70,-220 -20,-160 0,40 Z" fill="url(#lotusPink)" opacity="0.85"/>
    <path d="M 0,40 C 80,-60 120,-160 90,-200 C 70,-220 20,-160 0,40 Z" fill="url(#lotusPink)" opacity="0.85"/>

    <!-- Central Majestic Petal -->
    <path d="M 0,40 C -40,-80 -50,-180 0,-240 C 50,-180 40,-80 0,40 Z" fill="url(#lotusPink)"/>
    <path d="M 0,-240 L 0,40" stroke="url(#softGold)" stroke-width="2" stroke-dasharray="4,2"/>

    <!-- Front Side Petals -->
    <path d="M 0,40 C -120,10 -160,-80 -140,-120 C -110,-140 -50,-60 0,40 Z" fill="url(#lotusPink)"/>
    <path d="M 0,40 C 120,10 160,-80 140,-120 C 110,-140 50,-60 0,40 Z" fill="url(#lotusPink)"/>

    <!-- Gold Stitch Outline -->
    <path d="M 0,40 C -40,-80 -50,-180 0,-240 C 50,-180 40,-80 0,40 Z" fill="none" stroke="url(#softGold)" stroke-width="2" stroke-dasharray="5,3"/>

    <!-- Lotus Pod / Base -->
    <ellipse cx="0" cy="45" rx="70" ry="20" fill="url(#softGold)"/>
    <circle cx="-35" cy="45" r="5" fill="#071713"/>
    <circle cx="0" cy="45" r="5" fill="#071713"/>
    <circle cx="35" cy="45" r="5" fill="#071713"/>
  </g>

  <!-- Technical Spec Badge -->
  <g transform="translate(40, 520)">
    <rect width="210" height="42" rx="8" fill="#000000" opacity="0.6"/>
    <text x="15" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fef3c7">STITCHES: 22,100 | DST/PES</text>
  </g>

  <!-- Watermark Diagonal -->
  <g opacity="0.22" transform="rotate(-30 300 300)">
    <text x="-50" y="300" font-family="serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="12">MADHUS BOUTIQUE PREVIEW</text>
    <line x1="-100" y1="315" x2="700" y2="315" stroke="#ffffff" stroke-width="2" stroke-dasharray="10,5"/>
  </g>
</svg>
